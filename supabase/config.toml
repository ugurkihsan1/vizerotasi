project_id = "vizerotasi"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["vizerotasi://**", "http://localhost:8081/auth**"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "2MiB"

[functions.delete-account]
# Authorization is validated using Auth.getUser in the handler (also supports new JWT signing keys).
verify_jwt = false

[functions.retention-cleanup]
# Private scheduler secret is checked by the handler; no client can invoke cleanup.
verify_jwt = false
